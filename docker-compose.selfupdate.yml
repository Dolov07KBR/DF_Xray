# Обновление панели прямо из интерфейса.
#
# Подключается вторым файлом вместе с docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.selfupdate.yml up -d panel
# install.sh и dfxray подключают его автоматически, если файл лежит рядом.
#
# Код панели монтируется из каталога установки в /app, поэтому кнопка «Обновить»
# может заменить файлы на хосте; контейнер перезапускается по restart policy.
# Нужен только для панели: ноды и Caddy не затрагиваются.
# Накладка для самообновления панели из интерфейса: код монтируется из каталога
# установки, поэтому кнопка «Обновить» пишет свежие исходники на хост.
# Каталог должен принадлежать пользователю панели (uid 1000) — это делает install.sh.
services:
  panel:
    environment:
      DFX_SELF_UPDATE: "1"
      DFX_SELF_DIR: "/app"
    volumes:
      - dfxray-data:/data
      - ./:/app:rw
