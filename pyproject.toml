[project]
name = "dfxray-panel"
version = "1.0.0"
description = "DF_Xray Panel — лёгкая панель управления Xray с подписками, QR-кодами и мульти-нодами"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [{ name = "DF_Xray" }]
keywords = ["xray", "vless", "reality", "vpn", "panel", "subscription", "qr"]
classifiers = [
    "Environment :: Web Environment",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
]
# Ноль зависимостей: только стандартная библиотека Python.
dependencies = []

[project.scripts]
dfxray = "app.__main__:main"

[project.urls]
Homepage = "https://github.com/Dolov07KBR/DF_Xray"
Source = "https://github.com/Dolov07KBR/DF_Xray"
Issues = "https://github.com/Dolov07KBR/DF_Xray/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.vendor", "app.vendor.qrcode"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["app/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059", "RUF015", "E402"]
